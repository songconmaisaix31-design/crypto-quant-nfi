states:
  - RESEARCH_READY
  - DRY_RUN_ACTIVE
  - SHADOW_OBSERVING
  - TESTNET_READY
  - TESTNET_VALIDATED
  - MICRO_LIVE_BLOCKED
  - MANUAL_MICRO_LIVE_PENDING_APPROVAL
  - MANUAL_MICRO_LIVE_ALLOWED
  - AUTO_MICRO_LIVE_BLOCKED
  - INCIDENT_BLOCKED

allowed_transitions:
  RESEARCH_READY:
    - DRY_RUN_ACTIVE
  DRY_RUN_ACTIVE:
    - SHADOW_OBSERVING
  SHADOW_OBSERVING:
    - TESTNET_READY
  TESTNET_READY:
    - TESTNET_VALIDATED
  TESTNET_VALIDATED:
    - MANUAL_MICRO_LIVE_PENDING_APPROVAL

forbidden:
  - from: RESEARCH_READY
    to: MANUAL_MICRO_LIVE_ALLOWED
  - from: TESTNET_READY
    to: AUTO_MICRO_LIVE_ALLOWED
  - from: ANY
    to: AUTO_MICRO_LIVE_ALLOWED

